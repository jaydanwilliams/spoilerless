services:
  db:
    image: postgres:16
    container_name: spoilerless-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: spoilerless
      POSTGRES_PASSWORD: spoilerless
      POSTGRES_DB: spoilerless
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
